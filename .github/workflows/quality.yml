name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository validation
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Browser quality audit
        run: npm run audit

      - name: Performance quality audit
        run: npm run audit:performance

      - name: Lighthouse audit
        run: |
          npx --yes lighthouse http://127.0.0.1:4321/ \
            --chrome-flags="--headless --no-sandbox" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/lighthouse.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const report = JSON.parse(fs.readFileSync("/tmp/lighthouse.json", "utf8"));
          const categories = ["performance", "accessibility", "best-practices", "seo"];
          const scores = Object.fromEntries(
            categories.map((name) => [name, Math.round(report.categories[name].score * 100)]),
          );

          console.log("Lighthouse scores:", scores);

          const failedScores = categories.filter((name) => scores[name] < 95);
          const lcp = report.audits["largest-contentful-paint"]?.numericValue ?? Infinity;
          const cls = report.audits["cumulative-layout-shift"]?.numericValue ?? Infinity;

          console.log(`LCP: ${Math.round(lcp)}ms`);
          console.log(`CLS: ${cls}`);

          if (failedScores.length || lcp >= 1500 || cls > 0) {
            console.error("Lighthouse target failed.");
            if (failedScores.length) console.error("Scores below 95:", failedScores.join(", "));
            process.exit(1);
          }
          NODE

      - name: Interaction responsiveness audit
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          await page.goto("http://127.0.0.1:4321/", { waitUntil: "networkidle" });

          const supported = await page.evaluate(() =>
            PerformanceObserver.supportedEntryTypes.includes("event")
          );
          if (!supported) {
            throw new Error("PerformanceEventTiming is unavailable; cannot measure interaction responsiveness.");
          }

          await page.evaluate(() => {
            window.__interactionDurations = [];
            const observer = new PerformanceObserver((list) => {
              for (const entry of list.getEntries()) {
                if (entry.interactionId > 0) {
                  window.__interactionDurations.push({
                    name: entry.name,
                    duration: entry.duration,
                    interactionId: entry.interactionId,
                  });
                }
              }
            });
            observer.observe({ type: "event", buffered: true, durationThreshold: 16 });
            window.__interactionObserver = observer;
          });

          const menu = page.locator("nav details[data-nav-mobile] summary");
          await menu.click();
          await page.waitForTimeout(150);

          const search = page.locator("nav details[data-nav-mobile] button[data-command-open]");
          await search.click();
          await page.waitForTimeout(150);

          const durations = await page.evaluate(() => {
            window.__interactionObserver.disconnect();
            return window.__interactionDurations.map((entry) => entry.duration);
          });

          await browser.close();

          if (!durations.length) {
            throw new Error("No measurable user interactions were captured.");
          }

          const inp = Math.max(...durations);
          console.log(`Lab INP: ${Math.round(inp)}ms`);
          console.log(`Measured interactions: ${durations.length}`);

          if (inp >= 200) {
            throw new Error(`Interaction responsiveness target failed: ${Math.round(inp)}ms >= 200ms`);
          }
          NODE
